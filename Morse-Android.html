  <script id="morse-enter-key">
    (function () {
      function isEditable(target) {
        return target instanceof Element &&
          Boolean(target.closest("input, select, textarea, button, [contenteditable='true']"));
      }

      function forwardEnterAsSpace(event) {
        if (document.body.classList.contains("morse-chat-active")) return;
        if ((event.code !== "Enter" && event.code !== "NumpadEnter") ||
            event.repeat || isEditable(event.target)) return;

        event.preventDefault();
        event.stopImmediatePropagation();
        window.dispatchEvent(new KeyboardEvent(event.type, {
          code: "Space",
          key: " ",
          bubbles: true,
          cancelable: true
        }));
      }

      function showEnterHint() {
        document.querySelectorAll("span").forEach(function (span) {
          if (span.textContent === "[ESPACIO]") span.textContent = "[ESPACIO / ENTER]";
        });
      }

      window.addEventListener("keydown", forwardEnterAsSpace, true);
      window.addEventListener("keyup", forwardEnterAsSpace, true);
      new MutationObserver(showEnterHint).observe(document.getElementById("root"), {
        childList: true,
        subtree: true
      });
      showEnterHint();
    })();
  </script>
